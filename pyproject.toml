[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usdchecker-ui"
version = "0.1.0"
description = "Desktop UI wrapping OpenUSD usdchecker with humanized diagnostics."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Adobe" }]

dependencies = [
    "PySide6>=6.7",
    # usd-core 25.11 is the last known stable before the 26.x line.
    # If the 25.11 wheel breaks on Mac ARM + Py3.12, fall back to 25.8.
    "usd-core>=25.11,<27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.10",
    "ruff>=0.6",
    "import-linter>=2.0",
]

[project.scripts]
usdchecker-ui = "usdchecker_ui.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"usdchecker_ui.core" = ["patterns.yaml"]
