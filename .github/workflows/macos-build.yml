name: macOS build

# Manual trigger — click "Run workflow" on the Actions tab when you need
# a fresh .app to smoke-test. Runs ruff + lint-imports + pytest before
# packaging, so AC 10 / AC 12 are verified on every build.
#
# Artifact: USDCheckerUI-macos-arm64 (dist/USDCheckerUI.app contents).
# Download it from the run page, unzip, launch USDCheckerUI.app.
#
# macos-latest on GitHub runners is Apple Silicon (arm64), matching
# target_arch="arm64" in packaging/pyinstaller.macos.spec. No signing
# / notarization in this iteration — first launch on a peer's machine
# may need:
#     xattr -d com.apple.quarantine USDCheckerUI.app

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    env:
      # Belt + braces: if a runner image ever ships with PYTHONPATH set
      # to a hand-built USD path, we would segfault on `from pxr import Tf`.
      # Empty string scrubs it without relying on shell conditionals.
      PYTHONPATH: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Import-linter (core-no-qt contract)
        run: lint-imports

      - name: Pytest
        run: pytest

      - name: Clean build + dist trees
        run: rm -rf build dist

      - name: Build macOS .app (PyInstaller)
        run: pyinstaller packaging/pyinstaller.macos.spec --noconfirm

      - name: Report bundle size
        run: |
          size_bytes=$(du -s -k dist/USDCheckerUI.app | cut -f1)
          size_mb=$((size_bytes / 1024))
          echo "Bundle size: ${size_mb} MB"
          echo "Baseline (spec): ~205 MB. If this creeps above ~350 MB,"
          echo "consider --exclude-module pxr.UsdImagingGL / pxr.Hgi*"
          echo "in packaging/pyinstaller.macos.spec (rendering modules"
          echo "unused by the validator)."

      # actions/upload-artifact zips whatever `path:` points at using
      # a plain archive format that does NOT preserve macOS-specific
      # metadata — crucially, symlinks get dereferenced into full file
      # copies. PyInstaller's .app bundle relies heavily on symlinks
      # from Contents/Resources/ into Contents/Frameworks/ (pxr/,
      # PySide6/, libusd_ms.dylib, every Qt framework, ...). When those
      # symlinks become copies, pxr.Plug.Registry discovers every
      # plugInfo.json twice and UsdSchemaRegistry aborts with a null
      # smart-ptr dereference at init time — the .app crashes before
      # its first frame.
      #
      # `ditto -c -k --sequesterRsrc --keepParent` creates a macOS-
      # aware zip that preserves symlinks, resource forks, and xattrs.
      # Finder handles this zip natively: double-click yields a
      # working .app with its internal symlinks intact.
      - name: Repackage .app with ditto (preserve symlinks)
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
              dist/USDCheckerUI.app USDCheckerUI.app.zip
          echo "ditto-zipped size:"
          ls -lh USDCheckerUI.app.zip

      - name: Upload .app zip as artifact
        uses: actions/upload-artifact@v7
        with:
          name: USDCheckerUI-macos-arm64
          path: USDCheckerUI.app.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0  # ditto already compressed; skip double-pass
